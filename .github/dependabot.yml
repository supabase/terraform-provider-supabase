# See GitHub's documentation for more information on this file:
# https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      go-minor:
        update-types:
          - minor
          - patch
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      action-major:
        update-types:
          - minor
          - patch
          - major
  # govulncheck is tracked as a tool dependency in its own module so it does
  # not affect the provider's go.mod. Its dependencies are all indirect.
  - package-ecosystem: "gomod"
    directory: "/tools/govulncheck"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "all"
