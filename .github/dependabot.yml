# See GitHub's documentation for more information on this file:
# https://docs.github.com/en/code-security/supply-chain-security/keeping-your-dependencies-updated-automatically/configuration-options-for-dependency-updates
version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      go-minor:
        update-types:
          - minor
          - patch
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    groups:
      action-major:
        update-types:
          - minor
          - patch
          - major
  # Developer tools (govulncheck, tfplugindocs, changie) are tracked in their own module
  # so they do not affect the provider's go.mod. Only the tool modules themselves are
  # updated; their transitive dependencies are left alone.
  - package-ecosystem: "gomod"
    directory: "/tools"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "golang.org/x/vuln"
      - dependency-name: "github.com/hashicorp/terraform-plugin-docs"
      - dependency-name: "github.com/miniscruff/changie"
