# Terraform Provider testing workflow.
name: Tests

# This GitHub action runs your tests for each pull request and push.
# Optionally, you can turn it on using a schedule for regular testing.
on:
  pull_request:
  push:
    branches:
      - main

# Testing only needs permissions to read the repository contents.
permissions:
  contents: read

jobs:
  # Ensure project builds before running testing matrix
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ".go-version"
          cache: true
      - run: go mod download
      - run: go build -v .
      - name: Run linters
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ".go-version"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - run: go generate ./...
      - name: git diff
        run: |
          git diff --compact-summary --exit-code || \
            (echo; echo "Unexpected difference in directories after code generation. Run 'go generate ./...' command and commit."; exit 1)

  # Run unit tests. TF_ACC is deliberately unset so acceptance tests skip themselves.
  test:
    name: Unit Tests
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ".go-version"
          cache: true
      - run: go mod download
      - run: go test -v -cover ./...

  # Decide which acceptance tests are needed. See the script for the rules.
  # Acceptance tests are slow, so they run on pull requests only.
  changes:
    name: Detect changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      acceptance: ${{ steps.select.outputs.acceptance }}
      run: ${{ steps.select.outputs.run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: select
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: bash .github/scripts/select-acceptance-tests.sh

  # Run acceptance tests with the latest stable Terraform CLI
  testacc:
    name: Terraform Provider Acceptance Tests (changes)
    needs: [build, changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.acceptance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 121
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ".go-version"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false
      - run: go mod download
      - name: Run acceptance tests
        id: tests
        # Explicit bash enables pipefail, so a failing go test still fails the step through tee.
        shell: bash
        env:
          TF_ACC: "1"
          PARALLEL: "3"
          RUN: ${{ needs.changes.outputs.run }}
        run: |
          echo "go test -v -cover -timeout 120m -parallel $PARALLEL -run '$RUN' ./internal/provider/" > "$RUNNER_TEMP/testacc.cmd"
          go test -v -cover -timeout 120m -parallel "$PARALLEL" -run "$RUN" ./internal/provider/ 2>&1 | tee "$RUNNER_TEMP/testacc.log"
      - name: Write results to the job summary
        if: ${{ !cancelled() }}
        env:
          OUTCOME: ${{ steps.tests.outcome }}
          COMMAND_FILE: ${{ runner.temp }}/testacc.cmd
          LOG_FILE: ${{ runner.temp }}/testacc.log
        run: bash .github/scripts/write-test-summary.sh

  # Run every acceptance test, without change detection, after each push to main.
  testacc-main:
    name: Terraform Provider Acceptance Tests (all)
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ".go-version"
          cache: true
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: latest
          terraform_wrapper: false
      - run: go mod download
      - env:
          TF_ACC: "1"
          PARALLEL: "1" # parallel of 1 to serialize tests
        run: go test -v -cover -timeout 120m -parallel "$PARALLEL" -run=TestAcc ./internal/provider/
