# Checks source for known vulnerabilities.
name: Vulnerability Check

on:
  pull_request:
  push:
    branches:
      - main
  # Weekly, to catch advisories published between changes.
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: ".go-version"
          cache: true
      # Fails the job when vulnerabilities are found.
      - run: go tool -modfile=tools/go.mod govulncheck ./...
      # SARIF output always exits 0, so this step only reports to the Security tab.
      - run: go tool -modfile=tools/go.mod govulncheck -format sarif ./... > govulncheck.sarif
        if: ${{ !cancelled() }}
      # Pull requests from forks get a read-only token and cannot upload.
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck
